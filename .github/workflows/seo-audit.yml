name: SEO Audit

on:
  pull_request:
    branches: [main, dev]

jobs:
  seo:
    name: SEO & Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build site
        run: npm run build

      - name: Serve built site
        run: npx http-server ./dist -p 8080 &

      - name: Wait for the server to start
        run: sleep 5

      - name: Run SEO audit script
        run: node ./scripts/seo-audit.js

      - name: Enforce SEO score >= 100
        run: |
          SCORE=$(jq '.categories.seo.score' lighthouse-report.json)
          echo "SEO score: $SCORE"
          if (( $(echo "$SCORE < 1.00" | bc -l) )); then
            echo "SEO score below 100% – failing CI."
            exit 1
          fi
