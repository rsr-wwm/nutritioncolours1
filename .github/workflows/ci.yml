name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Type-check · Lint · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check (astro check)
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

  build:
    name: Astro Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  seo-gates:
    name: SEO / GEO Violation Gates
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Schema Integrity Gate (JSON-LD & Duplicate Business Entities)
        run: node scripts/validate-jsonld.mjs

      - name: HTML Semantics Gate (Single H1 per page)
        run: node scripts/check-html-semantics.mjs

      - name: Canonical Hygiene Gate (No redirect chains)
        run: node scripts/check-redirect-hops.mjs

      - name: Doorway Page Gate (Body shingling variance)
        run: node scripts/check-doorway.mjs

      - name: Internal Link Integrity Gate (No orphans)
        run: node scripts/check-orphan-links.mjs

      - name: YMYL Location Claims Verification Gate
        run: npx tsx scripts/check-location-ymyl.ts

      - name: YMYL Source & Indexability Gate
        run: npx tsx scripts/report-indexability-gaps.ts
